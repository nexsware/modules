name: Install Flyway on Server (Reusable)

on:
  workflow_call:
    inputs:
      server_host:
        description: 'Server host to install Flyway on'
        required: true
        type: string
      server_user:
        description: 'SSH user for the server'
        required: false
        type: string
        default: 'root'
      flyway_version:
        description: 'Flyway version to install'
        required: false
        type: string
        default: '11.20.0'
    secrets:
      SSH_PRIVATE_KEY:
        description: 'SSH private key for server access'
        required: true
    outputs:
      flyway_version:
        description: 'Installed Flyway version'
        value: ${{ jobs.install-flyway.outputs.flyway_version }}

jobs:
  install-flyway:
    runs-on: ubuntu-latest
    outputs:
      flyway_version: ${{ steps.verify-install.outputs.version }}
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/server_key << 'EOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/server_key

          # Add host key
          ssh-keyscan -H ${{ inputs.server_host }} >> ~/.ssh/known_hosts 2>/dev/null || true

          # Verify key format
          echo "Verifying SSH key..."
          if ! ssh-keygen -l -f ~/.ssh/server_key > /dev/null 2>&1; then
            echo "Error: SSH private key appears to be invalid"
            exit 1
          fi

          echo "✓ SSH key configured"

      - name: Install Flyway on Remote Server
        id: install
        run: |
          REQUIRED_VERSION="${{ inputs.flyway_version }}"

          echo "Connecting to server: ${{ inputs.server_user }}@${{ inputs.server_host }}"

          # Execute installation script on remote server
          ssh -i ~/.ssh/server_key \
              -o StrictHostKeyChecking=no \
              -o PasswordAuthentication=no \
              -o PubkeyAuthentication=yes \
              ${{ inputs.server_user }}@${{ inputs.server_host }} << 'ENDSSH'

          REQUIRED_VERSION="${{ inputs.flyway_version }}"

          # Function to compare versions
          version_ge() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]
          }

          echo "========================================="
          echo "Installing Flyway on $(hostname)"
          echo "========================================="

          # Check if Flyway is already installed
          if command -v flyway &> /dev/null; then
            INSTALLED_VERSION=$(flyway --version 2>&1 | grep -oP 'Flyway.*?\K\d+\.\d+\.\d+' || echo "0.0.0")
            echo "Found existing Flyway version: $INSTALLED_VERSION"
            echo "Required version: $REQUIRED_VERSION"

            # If installed version is the same, skip
            if [ "$INSTALLED_VERSION" = "$REQUIRED_VERSION" ]; then
              echo "✓ Flyway $REQUIRED_VERSION already installed, skipping installation"
              exit 0
            fi

            # If required version is newer, uninstall old version
            if version_ge "$REQUIRED_VERSION" "$INSTALLED_VERSION"; then
              echo "Newer version required ($REQUIRED_VERSION > $INSTALLED_VERSION)"
              echo "Uninstalling old version $INSTALLED_VERSION..."

              # Remove symlink
              sudo rm -f /usr/local/bin/flyway

              # Remove old flyway directories in common locations
              sudo rm -rf /opt/flyway-* 2>/dev/null || true
              sudo rm -rf /usr/local/flyway-* 2>/dev/null || true
              rm -rf ~/flyway-* 2>/dev/null || true

              echo "✓ Old version removed"
            else
              echo "Required version ($REQUIRED_VERSION) is older than installed ($INSTALLED_VERSION)"
              echo "Keeping existing installation"
              exit 0
            fi
          fi

          echo "Installing Flyway $REQUIRED_VERSION..."

          # Install to /opt directory (standard location for third-party software)
          cd /opt

          # Flyway releases are available on GitHub
          DOWNLOAD_URL="https://github.com/flyway/flyway/releases/download/flyway-$REQUIRED_VERSION/flyway-commandline-$REQUIRED_VERSION-linux-x64.tar.gz"
          echo "Download URL: $DOWNLOAD_URL"

          # Download with retries
          for i in {1..3}; do
            if sudo wget -O flyway.tar.gz "$DOWNLOAD_URL"; then
              echo "✓ Download successful"
              break
            else
              echo "Download attempt $i failed, retrying..."
              sudo rm -f flyway.tar.gz
              sleep 5
            fi
          done

          # Verify download
          if [ ! -f flyway.tar.gz ] || [ ! -s flyway.tar.gz ]; then
            echo "Error: Failed to download Flyway after 3 attempts"
            exit 1
          fi

          # Extract
          echo "Extracting Flyway..."
          sudo tar xzf flyway.tar.gz
          sudo rm flyway.tar.gz

          # Create symlink to /usr/local/bin for system-wide access
          sudo ln -s /opt/flyway-$REQUIRED_VERSION/flyway /usr/local/bin/flyway

          # Set proper permissions
          sudo chmod +x /opt/flyway-$REQUIRED_VERSION/flyway

          echo "✓ Flyway $REQUIRED_VERSION installed successfully to /opt/flyway-$REQUIRED_VERSION"

          ENDSSH

      - name: Verify Installation
        id: verify-install
        run: |
          echo "Verifying Flyway installation on remote server..."

          INSTALLED_VERSION=$(ssh -i ~/.ssh/server_key \
              -o StrictHostKeyChecking=no \
              ${{ inputs.server_user }}@${{ inputs.server_host }} \
              "flyway --version 2>&1 | grep -oP 'Flyway.*?\K\d+\.\d+\.\d+' || echo 'unknown'")

          echo "Installed version: $INSTALLED_VERSION"
          echo "version=$INSTALLED_VERSION" >> $GITHUB_OUTPUT

          if [ "$INSTALLED_VERSION" = "${{ inputs.flyway_version }}" ]; then
            echo "✓ Flyway ${{ inputs.flyway_version }} successfully installed and verified on remote server"
          else
            echo "Warning: Installed version ($INSTALLED_VERSION) differs from requested (${{ inputs.flyway_version }})"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/server_key
