name: Deploy Vultr Firewall Group (Reusable)

on:
  workflow_call:
    inputs:
      description:
        description: 'Description for the firewall group'
        required: true
        type: string
      firewall_type:
        description: 'Type of firewall: "web" (80,443 public), "api" (app port from app subnet), "database" (5432 from app subnet), "custom" (no extra ports). SSH controlled by enable_ssh. Add bastion_subnet to also allow app_port from bastion (e.g. for DB tunneling).'
        required: false
        type: string
        default: 'web'
      enable_ssh:
        description: 'Whether to add an SSH (port 22) inbound rule. Must be explicitly set to true — SSH is off by default'
        required: false
        type: boolean
        default: false
      allow_ssh_from:
        description: 'Comma-separated CIDR ranges allowed to SSH. Use bastion subnet (10.0.0.128/26) for app/db servers, leave empty for bastion host itself (0.0.0.0/0)'
        required: false
        type: string
        default: ''
      app_subnet:
        description: 'App subnet CIDR — restricts database port 5432 and API port access to this range (default: 10.0.0.0/26)'
        required: false
        type: string
        default: '10.0.0.0/26'
      app_port:
        description: 'Port the API server listens on — used when firewall_type is "api" (default: 5000)'
        required: false
        type: string
        default: '5000'
      bastion_subnet:
        description: 'Bastion subnet CIDR — when provided, adds an extra rule allowing the bastion to reach app_port (e.g. for SSH tunneling to the database). Leave empty to skip.'
        required: false
        type: string
        default: ''
      environment:
        description: 'Deployment environment (e.g., test, prod)'
        required: false
        type: string
        default: 'production'
      state_key:
        description: 'Unique key for this resource in the state bucket (e.g., test/firewall-web)'
        required: true
        type: string
      state_bucket:
        description: 'Vultr Object Storage bucket name for Terraform state'
        required: true
        type: string
      state_endpoint:
        description: 'Vultr Object Storage S3 endpoint URL (e.g., https://ewr1.vultrobjects.com)'
        required: true
        type: string
      terraform_dir:
        description: 'Directory containing Terraform configuration'
        required: false
        type: string
        default: 'modules/terraform/vultr/firewall'
    secrets:
      VULTR_API_KEY:
        description: 'Vultr API Key'
        required: true
      VULTR_OBJECT_STORAGE_ACCESS_KEY:
        description: 'Vultr Object Storage access key for Terraform state backend'
        required: true
      VULTR_OBJECT_STORAGE_SECRET_KEY:
        description: 'Vultr Object Storage secret key for Terraform state backend'
        required: true
    outputs:
      firewall_id:
        description: 'The ID of the created firewall group'
        value: ${{ jobs.deploy-firewall.outputs.firewall_id }}

jobs:
  deploy-firewall:
    runs-on: ubuntu-latest
    if: ${{ inputs.environment != 'prod' || github.ref == 'refs/heads/main' }}
    environment: ${{ inputs.environment }}
    outputs:
      firewall_id: ${{ steps.terraform-apply.outputs.firewall_id }}
    steps:
      - name: Checkout Terraform Modules
        uses: actions/checkout@v4
        with:
          repository: nexsware/modules
          path: modules

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: '1.6.0'
          terraform_wrapper: false

      - name: Build Inbound Firewall Rules
        id: build-rules
        run: |
          # Normalize SSH source CIDRs
          if [ -z "${{ inputs.allow_ssh_from }}" ]; then
            SSH_CIDRS='["0.0.0.0/0"]'
          else
            NORMALIZED=""
            IFS=',' read -ra IPS <<< "${{ inputs.allow_ssh_from }}"
            for ip in "${IPS[@]}"; do
              ip=$(echo "$ip" | xargs)
              [[ ! "$ip" =~ / ]] && ip="${ip}/32"
              NORMALIZED="${NORMALIZED}\"${ip}\","
            done
            SSH_CIDRS="[${NORMALIZED%,}]"
          fi

          # Start with an empty rules array
          RULES='[]'

          # Add one SSH rule per CIDR (skipped when enable_ssh is false)
          if [ "${{ inputs.enable_ssh }}" = "true" ]; then
            IDX=0
            while IFS= read -r cidr; do
              LABEL="allow-ssh"
              [ "$IDX" -gt 0 ] && LABEL="allow-ssh-${IDX}"
              RULE=$(jq -cn --arg label "$LABEL" --arg network "$cidr" \
                '{label:$label,protocol:"tcp",network:$network,port:"22",ip_type:"v4"}')
              RULES=$(echo "$RULES" | jq -c ". + [$RULE]")
              IDX=$((IDX+1))
            done < <(echo "$SSH_CIDRS" | jq -r '.[]')
          fi

          # Add type-specific rules
          FIREWALL_TYPE="${{ inputs.firewall_type }}"
          if [ "$FIREWALL_TYPE" = "web" ]; then
            RULES=$(echo "$RULES" | jq -c '. + [
              {"label":"allow-http","protocol":"tcp","network":"0.0.0.0/0","port":"80","ip_type":"v4"},
              {"label":"allow-https","protocol":"tcp","network":"0.0.0.0/0","port":"443","ip_type":"v4"}
            ]')
          elif [ "$FIREWALL_TYPE" = "api" ]; then
            RULES=$(echo "$RULES" | jq -c --arg subnet "${{ inputs.app_subnet }}" --arg port "${{ inputs.app_port }}" '. + [
              {"label":"allow-api","protocol":"tcp","network":$subnet,"port":$port,"ip_type":"v4"}
            ]')
          elif [ "$FIREWALL_TYPE" = "database" ]; then
            RULES=$(echo "$RULES" | jq -c --arg subnet "${{ inputs.app_subnet }}" '. + [
              {"label":"allow-postgres","protocol":"tcp","network":$subnet,"port":"5432","ip_type":"v4"}
            ]')
          fi

          # Allow bastion subnet to reach app_port (e.g. for SSH tunneling to database)
          if [ -n "${{ inputs.bastion_subnet }}" ]; then
            RULES=$(echo "$RULES" | jq -c --arg subnet "${{ inputs.bastion_subnet }}" --arg port "${{ inputs.app_port }}" '. + [
              {"label":"allow-bastion","protocol":"tcp","network":$subnet,"port":$port,"ip_type":"v4"}
            ]')
          fi

          echo "rules_json=$RULES" >> $GITHUB_OUTPUT

      - name: Create Terraform Variables File
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          cat > terraform.tfvars.json <<EOF
          {
            "vultr_api_key": "${{ secrets.VULTR_API_KEY }}",
            "description": "${{ inputs.description }}",
            "inbound_rules": ${{ steps.build-rules.outputs.rules_json }}
          }
          EOF

      - name: Debug - Show Generated Terraform Variables
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          echo "=== Generated terraform.tfvars.json ==="
          cat terraform.tfvars.json | jq 'del(.vultr_api_key)'
          echo "========================================"

      - name: Terraform Init
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          terraform init \
            -backend-config="bucket=${{ inputs.state_bucket }}" \
            -backend-config="key=${{ inputs.state_key }}/terraform.tfstate" \
            -backend-config="endpoint=${{ inputs.state_endpoint }}" \
            -backend-config="access_key=${{ secrets.VULTR_OBJECT_STORAGE_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.VULTR_OBJECT_STORAGE_SECRET_KEY }}" \
            -backend-config="region=us-east-1" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="force_path_style=true"

      - name: Terraform Apply
        id: terraform-apply
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          terraform apply -auto-approve
          echo "firewall_id=$(terraform output -raw id)" >> $GITHUB_OUTPUT

      - name: Display Firewall Info
        run: |
          echo "=== Vultr Firewall Group Provisioned ==="
          echo "Firewall ID:   ${{ steps.terraform-apply.outputs.firewall_id }}"
          echo "Description:   ${{ inputs.description }}"
          echo "Type:          ${{ inputs.firewall_type }}"
          echo "========================================"
