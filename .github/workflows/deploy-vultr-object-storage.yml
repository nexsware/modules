name: Deploy Vultr Object Storage (Reusable)

on:
  workflow_call:
    inputs:
      cluster_id:
        description: 'Vultr Object Storage cluster ID for the target region'
        required: true
        type: number
      tier_id:
        description: 'Vultr Object Storage performance tier ID (e.g., 1 for Performance)'
        required: true
        type: number
      label:
        description: 'Label for the object storage instance'
        required: true
        type: string
      environment:
        description: 'Deployment environment (e.g., test, prod)'
        required: true
        type: string
      state_key:
        description: 'Unique key for this resource in the state bucket (e.g., test/object-storage). Leave empty to use local state (bootstrap run).'
        required: false
        type: string
        default: ''
      state_bucket:
        description: 'Vultr Object Storage bucket name for Terraform state. Leave empty to use local state (bootstrap run).'
        required: false
        type: string
        default: ''
      state_endpoint:
        description: 'Vultr Object Storage S3 endpoint URL (e.g., https://ewr1.vultrobjects.com). Leave empty to use local state (bootstrap run).'
        required: false
        type: string
        default: ''
      terraform_dir:
        description: 'Directory containing Terraform configuration'
        required: false
        type: string
        default: 'modules/terraform/vultr/object-storage'
    secrets:
      VULTR_API_KEY:
        description: 'Vultr API Key'
        required: true
      VULTR_OBJECT_STORAGE_ACCESS_KEY:
        description: 'Vultr Object Storage access key for Terraform state backend (only required when state_bucket is provided)'
        required: false
      VULTR_OBJECT_STORAGE_SECRET_KEY:
        description: 'Vultr Object Storage secret key for Terraform state backend (only required when state_bucket is provided)'
        required: false
    outputs:
      storage_id:
        description: 'The ID of the created object storage instance'
        value: ${{ jobs.deploy-object-storage.outputs.storage_id }}
      region:
        description: 'The region where the object storage instance is deployed'
        value: ${{ jobs.deploy-object-storage.outputs.region }}
      status:
        description: 'The status of the object storage instance'
        value: ${{ jobs.deploy-object-storage.outputs.status }}

jobs:
  deploy-object-storage:
    runs-on: ubuntu-latest
    if: ${{ inputs.environment != 'prod' || github.ref == 'refs/heads/main' }}
    environment: ${{ inputs.environment }}
    outputs:
      storage_id: ${{ steps.terraform-apply.outputs.storage_id }}
      region: ${{ steps.terraform-apply.outputs.region }}
      status: ${{ steps.terraform-apply.outputs.status }}
    steps:
      - name: Checkout Terraform Modules
        uses: actions/checkout@v4
        with:
          repository: nexsware/modules
          path: modules

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: '1.6.0'
          terraform_wrapper: false

      - name: Create Terraform Variables File
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          cat > terraform.tfvars.json <<EOF
          {
            "vultr_api_key": "${{ secrets.VULTR_API_KEY }}",
            "cluster_id": ${{ inputs.cluster_id }},
            "tier_id": ${{ inputs.tier_id }},
            "label": "${{ inputs.label }}"
          }
          EOF

      - name: Debug - Show Generated Terraform Variables
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          echo "=== Generated terraform.tfvars.json ==="
          cat terraform.tfvars.json | jq 'del(.vultr_api_key)'
          echo "========================================"

      - name: Terraform Init
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          if [ -n "${{ inputs.state_bucket }}" ]; then
            cat > backend.tf <<'EOF'
          terraform { backend "s3" {} }
          EOF
            terraform init \
              -backend-config="bucket=${{ inputs.state_bucket }}" \
              -backend-config="key=${{ inputs.state_key }}/terraform.tfstate" \
              -backend-config="endpoint=${{ inputs.state_endpoint }}" \
              -backend-config="access_key=${{ secrets.VULTR_OBJECT_STORAGE_ACCESS_KEY }}" \
              -backend-config="secret_key=${{ secrets.VULTR_OBJECT_STORAGE_SECRET_KEY }}" \
              -backend-config="region=us-east-1" \
              -backend-config="skip_credentials_validation=true" \
              -backend-config="skip_metadata_api_check=true" \
              -backend-config="skip_region_validation=true" \
              -backend-config="force_path_style=true"
          else
            terraform init
          fi

      - name: Terraform Apply
        id: terraform-apply
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          terraform apply -auto-approve
          echo "storage_id=$(terraform output -raw id)" >> $GITHUB_OUTPUT
          echo "region=$(terraform output -raw region)" >> $GITHUB_OUTPUT
          echo "status=$(terraform output -raw status)" >> $GITHUB_OUTPUT

      - name: Display Object Storage Info
        run: |
          echo "=== Vultr Object Storage Provisioned ==="
          echo "Storage ID: ${{ steps.terraform-apply.outputs.storage_id }}"
          echo "Label:      ${{ inputs.label }}"
          echo "Region:     ${{ steps.terraform-apply.outputs.region }}"
          echo "Status:     ${{ steps.terraform-apply.outputs.status }}"
          echo "========================================"
