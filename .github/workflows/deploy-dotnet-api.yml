name: Deploy .NET API Container (Reusable)

on:
  workflow_call:
    inputs:
      # Application Configuration
      application_name:
        description: 'Application name (used for container naming)'
        required: true
        type: string
      environment:
        description: 'Deployment environment (test, prod)'
        required: true
        type: string
      app_directory:
        description: 'Directory containing the application code (relative to repo root)'
        required: false
        type: string
        default: '.'

      # .NET Configuration
      dotnet_version:
        description: '.NET SDK version to use'
        required: false
        type: string
        default: '10.0'

      # Docker Configuration
      docker_context:
        description: 'Docker build context directory (relative to repo root)'
        required: false
        type: string
        default: '.'
      dockerfile_path:
        description: 'Path to Dockerfile (relative to repo root)'
        required: false
        type: string
        default: 'Dockerfile'
      image_name:
        description: 'Docker image name (if different from application_name)'
        required: false
        type: string
        default: ''

      # Build Configuration
      build_configuration:
        description: 'Build configuration (Release or Debug)'
        required: false
        type: string
        default: 'Release'
      run_tests:
        description: 'Whether to run tests before building'
        required: false
        type: boolean
        default: false
      push_image:
        description: 'Whether to push the image to registry'
        required: false
        type: boolean
        default: true

      # Deployment Configuration
      enable_deploy:
        description: 'Whether to deploy to server after build'
        required: false
        type: boolean
        default: true
      server_ip:
        description: 'Server IP address to deploy to (use private VPC IP when bastion_ip is set)'
        required: false
        type: string
        default: ''
      bastion_ip:
        description: 'Bastion/jump host public IP for SSH ProxyJump (leave empty for direct SSH)'
        required: false
        type: string
        default: ''
      container_port:
        description: 'Port the container exposes'
        required: false
        type: string
        default: '8080'
      host_port:
        description: 'Port to bind on host (leave empty to use container_port)'
        required: false
        type: string
        default: ''
      container_name:
        description: 'Container name (defaults to application_name-environment)'
        required: false
        type: string
        default: ''
      setup_nginx:
        description: 'Install and configure nginx as a reverse proxy on the same server'
        required: false
        type: boolean
        default: false
      nginx_domain:
        description: 'Domain for nginx server_name and certbot (required when setup_nginx is true)'
        required: false
        type: string
        default: ''
      certbot_email:
        description: 'Email for certbot SSL certificate. Leave empty to skip SSL.'
        required: false
        type: string
        default: ''

      # Environment Variables
      env_vars:
        description: 'JSON object of environment variables to pass to container'
        required: false
        type: string
        default: '{}'

    secrets:
      # Server Access Secrets
      SSH_PRIVATE_KEY:
        description: 'SSH private key for server access'
        required: false
      ROOT_PASS:
        description: 'Root password for server (if not using SSH key)'
        required: false

      # Application Secrets (passed as env vars to container)
      JWT__KEY:
        description: 'JWT signing key (mapped to Jwt__Key)'
        required: false
      CONNECTION_STRINGS:
        description: 'JSON object mapping .NET ConnectionStrings key names to values — injected as ConnectionStrings__KeyName env vars'
        required: false
      API_KEY:
        description: 'API key'
        required: false
      EMAIL_PASSWORD:
        description: 'Email password'
        required: false

    outputs:
      image_tag:
        description: 'The Docker image tag that was built'
        value: ${{ jobs.build.outputs.image_tag }}
      deployment_status:
        description: 'Deployment status'
        value: ${{ jobs.deploy.outputs.status }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Restore Dependencies
        working-directory: ${{ inputs.app_directory }}
        run: dotnet restore

      - name: Build Application
        working-directory: ${{ inputs.app_directory }}
        run: dotnet build --configuration ${{ inputs.build_configuration }} --no-restore

      - name: Run Tests
        if: ${{ inputs.run_tests }}
        working-directory: ${{ inputs.app_directory }}
        run: dotnet test --configuration ${{ inputs.build_configuration }} --no-build --verbosity normal

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name != '' && inputs.image_name || inputs.application_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.environment }}
            type=raw,value=latest,enable=${{ inputs.environment == 'prod' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile_path }}
          push: ${{ inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_CONFIGURATION=${{ inputs.build_configuration }}
            ASPNETCORE_ENVIRONMENT=${{ inputs.environment }}
            DOTNET_ENVIRONMENT=${{ inputs.environment }}

      - name: Image Build Summary
        run: |
          echo "## Docker Image Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.enable_deploy && inputs.server_ip != '' }}
    environment: ${{ inputs.environment }}
    outputs:
      status: ${{ steps.deploy-container.outputs.status }}

    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -l -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "ERROR: deploy_key is invalid — check that SSH_PRIVATE_KEY secret is set in this repository"
            exit 1
          fi

          BASTION="${{ inputs.bastion_ip }}"
          if [ -n "$BASTION" ]; then
            cat > ~/.ssh/config << EOF
          Host ${{ inputs.server_ip }}
              ProxyJump root@${BASTION}
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null

          Host ${BASTION}
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
          EOF
            chmod 600 ~/.ssh/config
          else
            if ! grep -q "${{ inputs.server_ip }}" ~/.ssh/known_hosts 2>/dev/null; then
              ssh-keyscan -H ${{ inputs.server_ip }} >> ~/.ssh/known_hosts 2>/dev/null || true
            fi
          fi

      - name: Deploy Container to Server
        id: deploy-container
        run: |
          SERVER_IP="${{ inputs.server_ip }}"
          CONTAINER_NAME="${{ inputs.container_name != '' && inputs.container_name || format('{0}-{1}', inputs.application_name, inputs.environment) }}"
          IMAGE_REPOSITORY="ghcr.io/nexsware/${{ inputs.image_name != '' && inputs.image_name || inputs.application_name }}"
          IMAGE_TAG="${{ inputs.environment }}"
          IMAGE_REF="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          CONTAINER_PORT="${{ inputs.container_port }}"
          HOST_PORT="${{ inputs.host_port != '' && inputs.host_port || inputs.container_port }}"
          if [ "${{ inputs.setup_nginx }}" = "true" ]; then
            PORT_BINDING="127.0.0.1:${HOST_PORT}:${CONTAINER_PORT}"
          else
            PORT_BINDING="${HOST_PORT}:${CONTAINER_PORT}"
          fi

          echo "Deploying to server: $SERVER_IP (Ubuntu 24.04)"
          echo "Container name: $CONTAINER_NAME"
          echo "Image: $IMAGE_REF"
          echo "Port mapping: $HOST_PORT:$CONTAINER_PORT"

          # Parse environment variables from JSON
          ENV_VARS='${{ inputs.env_vars }}'

          # Create environment variables string for docker run
          ENV_FLAGS=""
          if [ "$ENV_VARS" != "{}" ]; then
            ENV_FLAGS=$(echo "$ENV_VARS" | jq -r 'to_entries | map("-e \(.key)=\(.value)") | join(" ")')
          fi

          # Add secrets as environment variables if provided
          if [ -n "${{ secrets.API_KEY }}" ]; then
            ENV_FLAGS="$ENV_FLAGS -e API_KEY='${{ secrets.API_KEY }}'"
          fi
          if [ -n "${{ secrets.JWT__KEY }}" ]; then
            ENV_FLAGS="$ENV_FLAGS -e Jwt__Key='${{ secrets.JWT__KEY }}'"
          fi
          if [ -n "${{ secrets.EMAIL_PASSWORD }}" ]; then
            ENV_FLAGS="$ENV_FLAGS -e Email__Password='${{ secrets.EMAIL_PASSWORD }}'"
          fi

          # Inject connection strings from JSON: {"KeyName":"value"} → -e ConnectionStrings__KeyName='value'
          if [ -n '${{ secrets.CONNECTION_STRINGS }}' ]; then
            while IFS= read -r entry; do
              key="${entry%%=*}"
              val="${entry#*=}"
              ENV_FLAGS="$ENV_FLAGS -e ${key}='${val}'"
            done < <(echo '${{ secrets.CONNECTION_STRINGS }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"')
          fi

          ssh -i ~/.ssh/deploy_key root@${SERVER_IP} << ENDSSH
          set -e

          # Install Docker if not already installed (Ubuntu 24.04)
          if ! command -v docker &> /dev/null; then
            echo "Docker not found. Installing Docker on Ubuntu 24.04..."

            # Update package index
            apt-get update

            # Install prerequisites
            apt-get install -y ca-certificates curl

            # Add Docker's official GPG key
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            chmod a+r /etc/apt/keyrings/docker.asc

            # Add Docker repository
            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
              $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
              tee /etc/apt/sources.list.d/docker.list > /dev/null

            # Install Docker
            apt-get update
            apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

            # Start and enable Docker
            systemctl enable docker
            systemctl start docker

            echo "✓ Docker installed successfully"
            docker --version
          else
            echo "✓ Docker is already installed"
            docker --version
          fi

          echo "Logging in to GitHub Container Registry..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          echo "Pulling latest image..."
          docker pull ${IMAGE_REF}

          echo "Stopping existing container (if any)..."
          docker stop ${CONTAINER_NAME} 2>/dev/null || true
          docker rm ${CONTAINER_NAME} 2>/dev/null || true

          echo "Starting new container..."
          docker run -d \
            --name ${CONTAINER_NAME} \
            --restart unless-stopped \
            -p ${{ inputs.container_port }}:${{ inputs.container_port }} \
            -e ASPNETCORE_ENVIRONMENT="${{ inputs.environment }}" \
            -e DOTNET_ENVIRONMENT="${{ inputs.environment }}" \
            ${ENV_FLAGS} \
            ${IMAGE_REF}

          echo "Waiting for container output..."
          sleep 10
          docker logs ${CONTAINER_NAME} 2>&1

          echo "Verifying container is running..."
          if docker ps | grep -q ${CONTAINER_NAME}; then
            echo "✓ Container ${CONTAINER_NAME} is running successfully"
            docker ps | grep ${CONTAINER_NAME}
          else
            echo "✗ Container failed to start"
            docker logs ${CONTAINER_NAME}
            exit 1
          fi
          ENDSSH

          echo "status=success" >> $GITHUB_OUTPUT

      - name: Setup Nginx Reverse Proxy
        if: ${{ inputs.enable_deploy && inputs.server_ip != '' && inputs.setup_nginx && inputs.nginx_domain != '' }}
        run: |
          SERVER_IP="${{ inputs.server_ip }}"
          DOMAIN="${{ inputs.nginx_domain }}"
          PORT="${{ inputs.container_port }}"
          EMAIL="${{ inputs.certbot_email }}"

          ssh -i ~/.ssh/deploy_key root@${SERVER_IP} << ENDSSH
          set -e
          if ! command -v nginx &> /dev/null; then
            apt-get update -qq
            apt-get install -y nginx
            systemctl enable nginx
            systemctl start nginx
          fi
          cat > /etc/nginx/sites-available/${DOMAIN} << 'NGINXEOF'
          server {
              listen 80;
              server_name ${DOMAIN};
              location / {
                  proxy_pass         http://127.0.0.1:${PORT};
                  proxy_http_version 1.1;
                  proxy_set_header   Upgrade     \$http_upgrade;
                  proxy_set_header   Connection  keep-alive;
                  proxy_set_header   Host        \$host;
                  proxy_set_header   X-Real-IP   \$remote_addr;
                  proxy_set_header   X-Forwarded-For   \$proxy_add_x_forwarded_for;
                  proxy_set_header   X-Forwarded-Proto \$scheme;
                  proxy_cache_bypass \$http_upgrade;
                  proxy_read_timeout 120s;
              }
          }
          NGINXEOF
          ln -sf /etc/nginx/sites-available/${DOMAIN} /etc/nginx/sites-enabled/${DOMAIN}
          rm -f /etc/nginx/sites-enabled/default
          nginx -t
          systemctl reload nginx
          if [ -n "${EMAIL}" ]; then
            if ! command -v certbot &> /dev/null; then
              apt-get install -y certbot python3-certbot-nginx
            fi
            certbot --nginx -d ${DOMAIN} --email ${EMAIL} --agree-tos --non-interactive --redirect
            systemctl reload nginx
          fi
          ENDSSH

      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

      - name: Deployment Summary
        run: |
          echo "## Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** ${{ inputs.server_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "**Container:** ${{ inputs.container_name != '' && inputs.container_name || format('{0}-{1}', inputs.application_name, inputs.environment) }}" >> $GITHUB_STEP_SUMMARY
          echo "**Port:** ${{ inputs.host_port != '' && inputs.host_port || inputs.container_port }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
