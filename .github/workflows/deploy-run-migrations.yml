name: Run Flyway Database Migration (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (e.g., test, prod)'
        required: true
        type: string
      database_host:
        description: 'Database host (VPC IP or hostname)'
        required: true
        type: string
      database_port:
        description: 'Database port'
        required: false
        type: string
        default: '5432'
      database_name:
        description: 'Database name'
        required: true
        type: string
      database_user:
        description: 'Database username'
        required: true
        type: string
      migrations_path:
        description: 'Path to migration files in repository (e.g., db/migrations, src/main/resources/db/migration). The workflow will look for .sql files in this directory.'
        required: true
        type: string
      flyway_command:
        description: 'Flyway command to run (migrate, validate, info, repair, clean, baseline)'
        required: false
        type: string
        default: 'migrate'
      server_host:
        description: 'Server host where Flyway is installed and migrations will run from'
        required: true
        type: string
      server_user:
        description: 'SSH user for the server'
        required: false
        type: string
        default: 'root'
      baseline_on_migrate:
        description: 'Enable baseline on migrate for existing databases'
        required: false
        type: boolean
        default: true
      baseline_version:
        description: 'Baseline version to use when baselining'
        required: false
        type: string
        default: '1'
      validate_on_migrate:
        description: 'Validate migrations before running'
        required: false
        type: boolean
        default: true
      out_of_order:
        description: 'Allow migrations to run out of order'
        required: false
        type: boolean
        default: false
      repository:
        description: 'Repository containing migrations (defaults to calling repo)'
        required: false
        type: string
        default: ''
      repository_ref:
        description: 'Branch/tag/commit to checkout (defaults to caller ref)'
        required: false
        type: string
        default: ''
    secrets:
      DATABASE_PASSWORD:
        description: 'Database password'
        required: true
      SSH_PRIVATE_KEY:
        description: 'SSH private key for tunneling (required if ssh_tunnel_host is provided)'
        required: false
    outputs:
      migration_status:
        description: 'Status of the migration execution'
        value: ${{ jobs.run-migration.outputs.migration_status }}
      flyway_info:
        description: 'Flyway info output (migration history)'
        value: ${{ jobs.run-migration.outputs.flyway_info }}

jobs:
  run-migration:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      migration_status: ${{ steps.execute-flyway.outputs.migration_status }}
      flyway_info: ${{ steps.flyway-info.outputs.info }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.repository_ref || github.ref }}

      - name: Verify Migration Files Exist
        run: |
          if [ ! -d "${{ inputs.migrations_path }}" ]; then
            echo "Error: Migration path '${{ inputs.migrations_path }}' does not exist"
            echo "Please ensure your migration files are in the correct directory"
            exit 1
          fi

          echo "Migration directory contents:"
          ls -la "${{ inputs.migrations_path }}"

          # Count SQL files
          SQL_COUNT=$(find "${{ inputs.migrations_path }}" -name "*.sql" | wc -l)
          echo "Found $SQL_COUNT SQL migration files"

          if [ "$SQL_COUNT" -eq 0 ]; then
            echo "Warning: No SQL migration files found in ${{ inputs.migrations_path }}"
          fi

      - name: Create Migration Archive
        run: |
          echo "Creating archive of migration files..."
          tar -czf migrations.tar.gz -C $(dirname "${{ inputs.migrations_path }}") $(basename "${{ inputs.migrations_path }}")
          echo "✓ Migration archive created"

      - name: Setup SSH Connection to Server
        run: |
          echo "Setting up SSH connection to server..."
          mkdir -p ~/.ssh
          cat > ~/.ssh/server_key << 'EOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/server_key

          # Add host key
          ssh-keyscan -H ${{ inputs.server_host }} >> ~/.ssh/known_hosts 2>/dev/null || true

          # Verify key format
          echo "Verifying SSH key..."
          if ! ssh-keygen -l -f ~/.ssh/server_key > /dev/null 2>&1; then
            echo "Error: SSH private key appears to be invalid"
            exit 1
          fi

          echo "✓ SSH connection configured"

      - name: Transfer Migration Files to Server
        run: |
          echo "Transferring migration files to server..."
          scp -i ~/.ssh/server_key \
              -o StrictHostKeyChecking=no \
              migrations.tar.gz \
              ${{ inputs.server_user }}@${{ inputs.server_host }}:/tmp/migrations.tar.gz

          echo "✓ Migration files transferred"

      - name: Run Flyway Migration on Server
        id: execute-flyway
        run: |
          echo "Running Flyway migration on server: ${{ inputs.server_user }}@${{ inputs.server_host }}"

          # Execute migration on remote server
          ssh -i ~/.ssh/server_key \
              -o StrictHostKeyChecking=no \
              ${{ inputs.server_user }}@${{ inputs.server_host }} << 'ENDSSH'

          set -e

          echo "========================================="
          echo "Flyway Migration on $(hostname)"
          echo "========================================="

          # Extract migration files
          mkdir -p /tmp/flyway-migrations
          cd /tmp/flyway-migrations
          tar -xzf /tmp/migrations.tar.gz

          MIGRATIONS_DIR="/tmp/flyway-migrations/$(basename "${{ inputs.migrations_path }}")"

          echo "Migration files extracted to: $MIGRATIONS_DIR"
          ls -la "$MIGRATIONS_DIR"

          # Set database connection details
          DB_HOST="${{ inputs.database_host }}"
          DB_PORT="${{ inputs.database_port }}"
          echo "Using direct connection to database from server"

          # Test database connectivity
          echo "Testing database connectivity..."
          if command -v psql &> /dev/null; then
            export PGPASSWORD='${{ secrets.DATABASE_PASSWORD }}'
            if psql -h $DB_HOST -p $DB_PORT -U ${{ inputs.database_user }} -d ${{ inputs.database_name }} -c "SELECT version();" > /dev/null 2>&1; then
              echo "✓ Successfully connected to database"
            else
              echo "✗ Failed to connect to database"
              exit 1
            fi
          else
            echo "Note: psql not available, skipping connectivity test"
          fi

          # Create Flyway configuration
          cat > /tmp/flyway.conf <<EOF
          flyway.url=jdbc:postgresql://$DB_HOST:$DB_PORT/${{ inputs.database_name }}
          flyway.user=${{ inputs.database_user }}
          flyway.password=${{ secrets.DATABASE_PASSWORD }}
          flyway.locations=filesystem:$MIGRATIONS_DIR
          flyway.baselineOnMigrate=${{ inputs.baseline_on_migrate }}
          flyway.baselineVersion=${{ inputs.baseline_version }}
          flyway.validateOnMigrate=${{ inputs.validate_on_migrate }}
          flyway.outOfOrder=${{ inputs.out_of_order }}
          flyway.cleanDisabled=true
          EOF

          echo "Flyway configuration created"

          # Get current migration status
          echo "Current migration status:"
          flyway info -configFiles=/tmp/flyway.conf || true

          # Execute Flyway command
          echo "Executing Flyway command: ${{ inputs.flyway_command }}"

          case "${{ inputs.flyway_command }}" in
            migrate)
              echo "Running database migrations..."
              flyway migrate -configFiles=/tmp/flyway.conf
              ;;
            validate)
              echo "Validating migrations..."
              flyway validate -configFiles=/tmp/flyway.conf
              ;;
            info)
              echo "Getting migration info..."
              flyway info -configFiles=/tmp/flyway.conf
              ;;
            repair)
              echo "Repairing migration history..."
              flyway repair -configFiles=/tmp/flyway.conf
              ;;
            clean)
              if [ "${{ inputs.environment }}" == "prod" ]; then
                echo "Error: 'clean' command is not allowed in production environment"
                exit 1
              fi
              echo "Warning: Cleaning database (removing all objects)..."
              flyway clean -configFiles=/tmp/flyway.conf
              ;;
            baseline)
              echo "Baselining database at version ${{ inputs.baseline_version }}..."
              flyway baseline -configFiles=/tmp/flyway.conf
              ;;
            *)
              echo "Error: Unknown Flyway command: ${{ inputs.flyway_command }}"
              exit 1
              ;;
          esac

          # Get updated migration status
          echo "Updated migration status:"
          flyway info -configFiles=/tmp/flyway.conf

          # Validate after migration if requested
          if [ "${{ inputs.flyway_command }}" == "migrate" ] && [ "${{ inputs.validate_on_migrate }}" == "true" ]; then
            echo "Validating database state after migration..."
            flyway validate -configFiles=/tmp/flyway.conf
            echo "✓ Database validation successful"
          fi

          # Cleanup
          rm -f /tmp/flyway.conf /tmp/migrations.tar.gz
          rm -rf /tmp/flyway-migrations

          echo "========================================="
          echo "Migration completed successfully"
          echo "========================================="

          ENDSSH

          # Capture exit code
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "migration_status=success" >> $GITHUB_OUTPUT
          else
            echo "migration_status=failed" >> $GITHUB_OUTPUT
            exit $EXIT_CODE
          fi

      - name: Get Migration Info
        id: flyway-info
        if: always()
        run: |
          echo "Fetching final migration info from server..."

          INFO_OUTPUT=$(ssh -i ~/.ssh/server_key \
              -o StrictHostKeyChecking=no \
              ${{ inputs.server_user }}@${{ inputs.server_host }} << 'ENDSSH'

          # Quick info check (Flyway might have been cleaned up)
          if command -v flyway &> /dev/null; then
            echo "Flyway is available on server"
          else
            echo "Note: Flyway info unavailable after migration"
          fi

          ENDSSH
          )

          echo "$INFO_OUTPUT"

          # Store info output
          echo "info<<EOF" >> $GITHUB_OUTPUT
          echo "$INFO_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Display Migration Summary
        if: always()
        run: |
          echo "========================================="
          echo "Flyway Migration Summary"
          echo "========================================="
          echo "Environment: ${{ inputs.environment }}"
          echo "Server: ${{ inputs.server_host }}"
          echo "Database: ${{ inputs.database_name }}"
          echo "Host: ${{ inputs.database_host }}"
          echo "Command: ${{ inputs.flyway_command }}"
          echo "Status: ${{ steps.execute-flyway.outputs.migration_status }}"
          echo "========================================="

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/server_key
          rm -f migrations.tar.gz
