name: Deploy Self-Hosted PostgreSQL (Reusable)

on:
  workflow_call:
    inputs:
      server_ip:
        description: 'Server IP address where PostgreSQL will be deployed'
        required: true
        type: string
      postgres_version:
        description: 'PostgreSQL version (e.g., 16, 15, 14)'
        required: true
        type: string
        default: ''
      postgres_db:
        description: 'Default database name to create'
        required: true
        type: string
        default: ''
      postgres_user:
        description: 'PostgreSQL username'
        required: true
        type: string
        default: 'postgres'
      container_name:
        description: 'Docker container name'
        required: true
        type: string
        default: ''
      data_volume:
        description: 'Docker volume name for data persistence'
        required: true
        type: string
        default: 'postgres-data'
      vpc_ip:
        description: 'VPC private IP to bind PostgreSQL to (e.g., 10.0.0.5). If empty, binds to all interfaces.'
        required: true
        type: string
        default: ''
      ssh_user:
        description: 'SSH user for server access'
        required: true
        type: string
        default: 'root'
    secrets:
      SSH_PRIVATE_KEY:
        description: 'SSH private key for server access (use secrets: inherit in calling workflow)'
        required: false
      POSTGRES_PASSWORD:
        description: 'PostgreSQL password (use secrets: inherit in calling workflow)'
        required: false
jobs:
  deploy-postgres:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ inputs.server_ip }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Check if Docker is installed
        id: check-docker
        run: |
          if ssh -i ~/.ssh/deploy_key ${{ inputs.ssh_user }}@${{ inputs.server_ip }} "command -v docker" &> /dev/null; then
            echo "docker_installed=true" >> $GITHUB_OUTPUT
            echo "Docker is already installed on the server"
          else
            echo "docker_installed=false" >> $GITHUB_OUTPUT
            echo "Docker is not installed on the server"
          fi

      - name: Install Docker on Server
        if: steps.check-docker.outputs.docker_installed == 'false'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ inputs.ssh_user }}@${{ inputs.server_ip }} bash << 'INSTALL_DOCKER'
          echo "Installing Docker..."
          curl -fsSL https://get.docker.com -o get-docker.sh
          sh get-docker.sh
          systemctl start docker
          systemctl enable docker
          rm -f get-docker.sh
          echo "Docker installed successfully"
          docker --version
          INSTALL_DOCKER

      - name: Deploy PostgreSQL Container
        run: |
          if [ -n "${{ inputs.vpc_ip }}" ]; then
            BIND_IP="${{ inputs.vpc_ip }}"
          else
            BIND_IP="0.0.0.0"
          fi

          ssh -i ~/.ssh/deploy_key ${{ inputs.ssh_user }}@${{ inputs.server_ip }} "BIND_IP=${BIND_IP}" bash << EOF
          mkdir -p ~/postgres
          cd ~/postgres

          # Determine the correct mount path based on PostgreSQL version
          PG_VERSION=${{ inputs.postgres_version }}
          if [ "${PG_VERSION%%.*}" -ge 18 ]; then
            VOLUME_MOUNT="${{ inputs.data_volume }}:/var/lib/postgresql"
          else
            VOLUME_MOUNT="${{ inputs.data_volume }}:/var/lib/postgresql/data"
          fi

          cat > docker-compose.yml << COMPOSE
          services:
            postgres:
              image: postgres:${{ inputs.postgres_version }}
              container_name: ${{ inputs.container_name }}
              restart: unless-stopped
              environment:
                POSTGRES_USER: ${{ inputs.postgres_user }}
                POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                POSTGRES_DB: ${{ inputs.postgres_db }}
              ports:
                - "${BIND_IP}:5432:5432"
              volumes:
                - ${VOLUME_MOUNT}
              networks:
                - internal
          networks:
            internal:
              driver: bridge
          volumes:
            ${{ inputs.data_volume }}:
              driver: local
          COMPOSE
          docker compose up -d
          EOF

      - name: Display Connection Information
        run: |
          echo "========================================="
          echo "PostgreSQL Deployed Successfully!"
          echo "========================================="
          echo ""
          echo "Server Details:"
          echo "  Server IP: ${{ inputs.server_ip }}"
          echo "  VPC IP: ${{ inputs.vpc_ip || 'Not set (binding to 0.0.0.0)' }}"
          echo ""
          echo "PostgreSQL Configuration:"
          echo "  Version: ${{ inputs.postgres_version }}"
          echo "  Container Name: ${{ inputs.container_name }}"
          echo "  Database Name: ${{ inputs.postgres_db }}"
          echo "  Username: ${{ inputs.postgres_user }}"
          echo "  Data Volume: ${{ inputs.data_volume }}"
          echo ""
          if [ -n "${{ inputs.vpc_ip }}" ]; then
            echo "Internal Connection (from within VPC):"
            echo "  Host: ${{ inputs.vpc_ip }}"
            echo "  Port: 5432"
            echo "  Connection String: postgresql://${{ inputs.postgres_user }}:[PASSWORD]@${{ inputs.vpc_ip }}:5432/${{ inputs.postgres_db }}"
          else
            echo "Internal Connection (from server):"
            echo "  Host: localhost"
            echo "  Port: 5432"
            echo "  Connection String: postgresql://${{ inputs.postgres_user }}:[PASSWORD]@localhost:5432/${{ inputs.postgres_db }}"
          fi
          echo ""
          echo "========================================="
          echo "Access from Local Machine (pgAdmin/psql):"
          echo "========================================="
          echo ""
          echo "Method 1: SSH Tunnel"
          echo "  1. Create SSH tunnel:"
          if [ -n "${{ inputs.vpc_ip }}" ]; then
            echo "     ssh -L 5432:${{ inputs.vpc_ip }}:5432 ${{ inputs.ssh_user }}@${{ inputs.server_ip }}"
          else
            echo "     ssh -L 5432:localhost:5432 ${{ inputs.ssh_user }}@${{ inputs.server_ip }}"
          fi
          echo ""
          echo "  2. Connect to PostgreSQL:"
          echo "     Host: localhost"
          echo "     Port: 5432"
          echo "     Username: ${{ inputs.postgres_user }}"
          echo "     Password: [Your POSTGRES_PASSWORD]"
          echo "     Database: ${{ inputs.postgres_db }}"
          echo ""
          echo "Method 2: pgAdmin SSH Tunnel (Built-in)"
          echo "  Connection Tab:"
          echo "    Host: ${{ inputs.vpc_ip || 'localhost' }}"
          echo "    Port: 5432"
          echo "    Username: ${{ inputs.postgres_user }}"
          echo "    Database: ${{ inputs.postgres_db }}"
          echo ""
          echo "  SSH Tunnel Tab:"
          echo "    Use SSH tunneling: Yes"
          echo "    Tunnel host: ${{ inputs.server_ip }}"
          echo "    Tunnel port: 22"
          echo "    Username: ${{ inputs.ssh_user }}"
          echo "    Authentication: Use your SSH key"
          echo ""
          echo "Method 3: Direct psql command"
          echo "  psql -h localhost -p 5432 -U ${{ inputs.postgres_user }} -d ${{ inputs.postgres_db }}"
          echo "  (After establishing SSH tunnel)"
          echo ""
          echo "========================================="
          echo "Docker Compose File Location:"
          echo "  Server path: ~/postgres/docker-compose.yml"
          echo ""
          echo "Useful Commands (on server):"
          echo "  View logs: docker logs ${{ inputs.container_name }}"
          echo "  Restart: cd ~/postgres && docker compose restart"
          echo "  Stop: cd ~/postgres && docker compose down"
          echo "  Start: cd ~/postgres && docker compose up -d"
          echo "========================================="

      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
