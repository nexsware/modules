name: Deploy Self-Hosted PostgreSQL (Reusable)

on:
  workflow_call:
    inputs:
      server_ip:
        description: 'Server IP address where PostgreSQL will be deployed'
        required: true
        type: string
      postgres_version:
        description: 'PostgreSQL version (e.g., 16, 15, 14)'
        required: true
        type: string
        default: ''
      postgres_db:
        description: 'Default database name to create'
        required: true
        type: string
        default: ''
      postgres_user:
        description: 'PostgreSQL username'
        required: true
        type: string
        default: 'postgres'
      container_name:
        description: 'Docker container name'
        required: true
        type: string
        default: ''
      data_volume:
        description: 'Docker volume name for data persistence'
        required: true
        type: string
        default: 'postgres-data'
      vpc_ip:
        description: 'VPC private IP to bind PostgreSQL to (e.g., 10.0.0.5). If empty, binds to all interfaces.'
        required: true
        type: string
        default: ''
      ssh_user:
        description: 'SSH user for server access'
        required: true
        type: string
        default: 'root'
    secrets:
      SSH_PRIVATE_KEY:
        description: 'SSH private key for server access (use secrets: inherit in calling workflow)'
        required: false
      POSTGRES_PASSWORD:
        description: 'PostgreSQL password (use secrets: inherit in calling workflow)'
        required: false
jobs:
  deploy-postgres:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ inputs.server_ip }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Check if Docker is installed
        id: check-docker
        run: |
          if ssh -i ~/.ssh/deploy_key ${{ inputs.ssh_user }}@${{ inputs.server_ip }} "command -v docker" &> /dev/null; then
            echo "docker_installed=true" >> $GITHUB_OUTPUT
            echo "Docker is already installed on the server"
          else
            echo "docker_installed=false" >> $GITHUB_OUTPUT
            echo "Docker is not installed on the server"
          fi

      - name: Install Docker on Server
        if: steps.check-docker.outputs.docker_installed == 'false'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ inputs.ssh_user }}@${{ inputs.server_ip }} bash << 'INSTALL_DOCKER'
          echo "Installing Docker..."
          curl -fsSL https://get.docker.com -o get-docker.sh
          sh get-docker.sh
          systemctl start docker
          systemctl enable docker
          rm -f get-docker.sh
          echo "Docker installed successfully"
          docker --version
          INSTALL_DOCKER

      - name: Deploy PostgreSQL Container
        run: |
          if [ -n "${{ inputs.vpc_ip }}" ]; then
            BIND_IP="${{ inputs.vpc_ip }}"
          else
            BIND_IP="0.0.0.0"
          fi

          ssh -i ~/.ssh/deploy_key ${{ inputs.ssh_user }}@${{ inputs.server_ip }} "mkdir -p ~/postgres && cd ~/postgres && cat > docker-compose.yml" << 'EOF'
          services:
            postgres:
              image: postgres:${{ inputs.postgres_version }}
              container_name: ${{ inputs.container_name }}
              restart: unless-stopped
              environment:
                POSTGRES_USER: ${{ inputs.postgres_user }}
                POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                POSTGRES_DB: ${{ inputs.postgres_db }}
              ports:
                - "${BIND_IP}:5432:5432"
              volumes:
                - ${{ inputs.data_volume }}:/var/lib/postgresql/data
              networks:
                - internal
          networks:
            internal:
              driver: bridge
          volumes:
            ${{ inputs.data_volume }}:
              driver: local
          EOF

          ssh -i ~/.ssh/deploy_key ${{ inputs.ssh_user }}@${{ inputs.server_ip }} "cd ~/postgres && docker compose up -d"

      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
