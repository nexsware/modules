name: Deploy Self-Hosted PostgreSQL (Reusable)

on:
  workflow_call:
    inputs:
      server_ip:
        description: 'Server IP address where PostgreSQL will be deployed'
        required: true
        type: string
      postgres_version:
        description: 'PostgreSQL version (e.g., 16, 15, 14)'
        required: true
        type: string
        default: ''
      postgres_db:
        description: 'Default database name to create'
        required: true
        type: string
        default: ''
      postgres_user:
        description: 'PostgreSQL username'
        required: true
        type: string
        default: 'postgres'
      container_name:
        description: 'Docker container name'
        required: true
        type: string
        default: ''
      data_volume:
        description: 'Docker volume name for data persistence'
        required: true
        type: string
        default: 'postgres-data'
      vpc_ip:
        description: 'VPC private IP to bind PostgreSQL to (e.g., 10.0.0.5). If empty, binds to all interfaces.'
        required: true
        type: string
        default: ''
      ssh_user:
        description: 'SSH user for server access'
        required: true
        type: string
        default: 'root'
    secrets:
      SSH_PRIVATE_KEY:
        description: 'SSH private key for server access'
        required: true
      POSTGRES_PASSWORD:
        description: 'PostgreSQL password'
        required: true
jobs:
  deploy-postgres:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy PostgreSQL Container
        run: |
          ssh ${{ inputs.ssh_user }}@${{ inputs.server_ip }} << 'ENDSSH'
          set -e
          if [ -n "${{ inputs.vpc_ip }}" ]; then
            BIND_IP="${{ inputs.vpc_ip }}"
          else
            BIND_IP="0.0.0.0"
          fi
          mkdir -p ~/postgres
          cd ~/postgres
          cat > docker-compose.yml << 'DOCKERCOMPOSE'
services:
  postgres:
    image: postgres:${{ inputs.postgres_version }}
    container_name: ${{ inputs.container_name }}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${{ inputs.postgres_user }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ inputs.postgres_db }}
    ports:
      - "${BIND_IP}:5432:5432"
    volumes:
      - ${{ inputs.data_volume }}:/var/lib/postgresql/data
    networks:
      - internal
networks:
  internal:
    driver: bridge
volumes:
  ${{ inputs.data_volume }}:
DOCKERCOMPOSE
          docker compose up -d
          ENDSSH
