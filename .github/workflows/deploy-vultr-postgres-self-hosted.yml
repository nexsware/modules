name: Deploy Vultr Self-Hosted PostgreSQL (Reusable)

on:
  workflow_call:
    inputs:
      region:
        description: 'Vultr region slug (e.g., jnb for Johannesburg)'
        required: true
        type: string
      os_id:
        description: 'Vultr OS ID (e.g., 2284 for Ubuntu 24.04 LTS)'
        required: true
        type: number
      label:
        description: 'Label for the instance'
        required: true
        type: string
      plan:
        description: 'Vultr plan slug (e.g., vc2-2c-4gb)'
        required: false
        type: string
        default: 'vc2-2c-4gb'
      hostname:
        description: 'Hostname — defaults to label if empty'
        required: false
        type: string
        default: ''
      postgres_version:
        description: 'PostgreSQL major version to install (e.g., 16)'
        required: false
        type: string
        default: '16'
      port:
        description: 'Port PostgreSQL will listen on'
        required: false
        type: number
        default: 5432
      listen_address:
        description: "PostgreSQL listen_addresses setting ('*' for all interfaces)"
        required: false
        type: string
        default: '*'
      private_ip:
        description: 'Static private IP to assign to the VPC interface (e.g., 10.0.0.65). Must be within db_subnet. Leave empty to use Vultr auto-assigned IP.'
        required: false
        type: string
        default: ''
      db_subnet:
        description: 'CIDR of the subnet within the VPC where this database instance is placed (e.g., 10.0.0.64/26)'
        required: false
        type: string
        default: '10.0.0.64/26'
      bastion_subnet:
        description: 'CIDR of the bastion subnet — a route is added so the database can reach the bastion (e.g., 10.0.0.128/26)'
        required: false
        type: string
        default: '10.0.0.128/26'
      app_subnet:
        description: 'CIDR of the app subnet — a route is added so the database can reach app servers (e.g., 10.0.0.0/26)'
        required: false
        type: string
        default: '10.0.0.0/26'
      databases:
        description: 'Comma-separated list of databases to create'
        required: false
        type: string
        default: ''
      service_account_username:
        description: 'Service account username to create'
        required: false
        type: string
        default: 'srv_account'
      database_users:
        description: >-
          Optional JSON array of database users, e.g.
          [{"username":"svc-app","privileges":"crud"}]. privileges is "crud"
          (data access and EXECUTE on routines, no DDL) or "all" (ALL
          PRIVILEGES, the default). Passwords are NOT set here -- the secrets
          context is unavailable in a caller's `with:` block -- supply them via
          the DATABASE_USER_PASSWORDS secret instead. Entries are merged over
          the account built from SERVICE_ACCOUNT / SERVICE_ACCOUNT_PASSWORD, so
          a matching username overrides it.
        required: false
        type: string
        default: ''
      firewall_group_id:
        description: 'Vultr firewall group ID to attach (leave empty for none)'
        required: false
        type: string
        default: ''
      vpc_ids:
        description: 'Comma-separated Vultr VPC 2.0 IDs to attach for private networking'
        required: false
        type: string
        default: ''
      environment:
        description: 'Deployment environment (e.g., test, prod)'
        required: true
        type: string
      state_key:
        description: 'Unique key for this resource in the state bucket (e.g., test/postgres-self-hosted)'
        required: true
        type: string
      state_bucket:
        description: 'Vultr Object Storage bucket name for Terraform state'
        required: false
        type: string
        default: 'nexsware-terraform-state'
      terraform_dir:
        description: 'Directory containing Terraform configuration'
        required: false
        type: string
        default: 'modules/terraform/vultr/postgres-self-hosted'
    secrets:
      VULTR_API_KEY:
        description: 'Vultr API Key'
        required: true
      VULTR_OBJECT_STORAGE_ACCESS_KEY:
        description: 'Vultr Object Storage access key for Terraform state backend'
        required: true
      VULTR_OBJECT_STORAGE_SECRET_KEY:
        description: 'Vultr Object Storage secret key for Terraform state backend'
        required: true
      POSTGRES_PASSWORD:
        description: 'Password for the postgres superuser'
        required: true
      SERVICE_ACCOUNT:
        description: 'Service account username (overrides service_account_username input if provided)'
        required: false
      SERVICE_ACCOUNT_PASSWORD:
        description: 'Password for the service account user'
        required: false
      BASTION_SSH_KEY_ID:
        description: 'Vultr SSH key ID of the bastion host — authorizes the bastion to SSH into this instance'
        required: false
      DATABASE_USER_PASSWORDS:
        description: >-
          JSON object of {username: password} supplying passwords for the users
          named in the database_users input, e.g. {"svc-app":"..."}. Required
          whenever database_users is set.
        required: false
    outputs:
      instance_id:
        description: 'The ID of the created instance'
        value: ${{ jobs.deploy-postgres.outputs.instance_id }}
      ip_address:
        description: 'The public IPv4 address of the instance'
        value: ${{ jobs.deploy-postgres.outputs.ip_address }}
      internal_ip:
        description: 'The private IP address within attached VPCs — use this for app connections'
        value: ${{ jobs.deploy-postgres.outputs.internal_ip }}
      port:
        description: 'The port PostgreSQL is listening on'
        value: ${{ jobs.deploy-postgres.outputs.port }}

jobs:
  deploy-postgres:
    runs-on: ubuntu-latest
    if: ${{ inputs.environment != 'prod' || github.ref == 'refs/heads/main' }}
    environment: ${{ inputs.environment }}
    outputs:
      instance_id: ${{ steps.terraform-apply.outputs.instance_id }}
      ip_address: ${{ steps.terraform-apply.outputs.ip_address }}
      internal_ip: ${{ steps.terraform-apply.outputs.internal_ip }}
      port: ${{ steps.terraform-apply.outputs.port }}
    steps:
      - name: Checkout Terraform Modules
        uses: actions/checkout@v4
        with:
          repository: nexsware/modules
          path: modules

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Prepare List Inputs
        id: prepare-lists
        run: |
          # Convert comma-separated vpc_ids to JSON array
          if [ -z "${{ inputs.vpc_ids }}" ]; then
            echo "vpc_ids_json=[]" >> $GITHUB_OUTPUT
          else
            IFS=',' read -ra IDS <<< "${{ inputs.vpc_ids }}"
            JSON="["
            for i in "${!IDS[@]}"; do
              ID=$(echo "${IDS[$i]}" | xargs)
              JSON+="\"${ID}\""
              [ $i -lt $(( ${#IDS[@]} - 1 )) ] && JSON+=","
            done
            JSON+="]"
            echo "vpc_ids_json=$JSON" >> $GITHUB_OUTPUT
          fi

          # Build ssh_key_ids JSON array from BASTION_SSH_KEY_ID secret
          if [ -z "${{ secrets.BASTION_SSH_KEY_ID }}" ]; then
            echo "ssh_key_ids_json=[]" >> $GITHUB_OUTPUT
          else
            echo "ssh_key_ids_json=[\"${{ secrets.BASTION_SSH_KEY_ID }}\"]" >> $GITHUB_OUTPUT
          fi

          # Convert comma-separated databases to JSON array
          if [ -z "${{ inputs.databases }}" ]; then
            echo "databases_json=[]" >> $GITHUB_OUTPUT
          else
            IFS=',' read -ra DBS <<< "${{ inputs.databases }}"
            JSON="["
            for i in "${!DBS[@]}"; do
              DB=$(echo "${DBS[$i]}" | xargs)
              JSON+="\"${DB}\""
              [ $i -lt $(( ${#DBS[@]} - 1 )) ] && JSON+=","
            done
            JSON+="]"
            echo "databases_json=$JSON" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Database Users
        id: prepare-users
        # Same reasoning as the tfvars step: the password is read from the
        # environment so its contents are never parsed as shell.
        env:
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
          SERVICE_ACCOUNT_PASSWORD: ${{ secrets.SERVICE_ACCOUNT_PASSWORD }}
          SERVICE_ACCOUNT_USERNAME_INPUT: ${{ inputs.service_account_username }}
          DATABASE_USERS: ${{ inputs.database_users }}
          DATABASE_USER_PASSWORDS: ${{ secrets.DATABASE_USER_PASSWORDS }}
        run: |
          # 1. The single service account, unchanged: privileges default to
          #    "all" so existing callers keep the grants they already have.
          if [ -n "$SERVICE_ACCOUNT_PASSWORD" ]; then
            if [ -n "$SERVICE_ACCOUNT" ]; then
              USERNAME="$SERVICE_ACCOUNT"
            else
              USERNAME="$SERVICE_ACCOUNT_USERNAME_INPUT"
            fi
            USERS_JSON=$(jq -cn \
              --arg user "$USERNAME" \
              --arg pass "$SERVICE_ACCOUNT_PASSWORD" \
              '{($user): {password: $pass, privileges: "all"}}')
          else
            USERS_JSON='{}'
          fi

          # 2. Users declared in the database_users input. Their passwords come
          #    from the DATABASE_USER_PASSWORDS secret, because the secrets
          #    context is not available in a caller's `with:` block.
          if [ -n "$DATABASE_USERS" ]; then
            if ! printf '%s' "$DATABASE_USERS" | jq -e 'type == "array"' >/dev/null 2>&1; then
              echo "::error::database_users must be a JSON array of {username, privileges}"
              exit 1
            fi
            if printf '%s' "$DATABASE_USERS" | jq -e 'any(.[]; (.username // "") == "")' >/dev/null; then
              echo "::error::every database_users entry needs a non-empty username"
              exit 1
            fi
            if printf '%s' "$DATABASE_USERS" | jq -e 'any(.[]; (.privileges // "all") | . != "crud" and . != "all")' >/dev/null; then
              echo "::error::database_users privileges must be \"crud\" or \"all\""
              exit 1
            fi
            if [ -z "$DATABASE_USER_PASSWORDS" ]; then
              echo "::error::database_users is set but the DATABASE_USER_PASSWORDS secret is empty"
              exit 1
            fi
            if ! printf '%s' "$DATABASE_USER_PASSWORDS" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "::error::DATABASE_USER_PASSWORDS must be a JSON object of {username: password}"
              exit 1
            fi
            MISSING=$(jq -rn \
              --argjson users "$DATABASE_USERS" \
              --argjson pw "$DATABASE_USER_PASSWORDS" \
              '[$users[].username | select((($pw[.]) // "") == "")] | join(", ")')
            if [ -n "$MISSING" ]; then
              echo "::error::DATABASE_USER_PASSWORDS has no password for: $MISSING"
              exit 1
            fi
            EXTRA_JSON=$(jq -cn \
              --argjson users "$DATABASE_USERS" \
              --argjson pw "$DATABASE_USER_PASSWORDS" \
              '[ $users[] | { (.username): { password: $pw[.username], privileges: (.privileges // "all") } } ] | add // {}')
            USERS_JSON=$(jq -cn --argjson base "$USERS_JSON" --argjson extra "$EXTRA_JSON" '$base * $extra')
          fi

          echo "users_json=$USERS_JSON" >> $GITHUB_OUTPUT
          # Names only — never the passwords.
          echo "Configured database users: $(printf '%s' "$USERS_JSON" | jq -r 'to_entries | map("\(.key) (\(.value.privileges))") | join(", ")')"

      - name: Create Terraform Variables File
        working-directory: ${{ inputs.terraform_dir }}
        # Values reach jq through the environment rather than being interpolated
        # into the script body, so quotes, backslashes and $ inside a secret can
        # neither break the generated JSON nor be expanded by the shell.
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REGION: ${{ inputs.region }}
          PLAN: ${{ inputs.plan }}
          OS_ID: ${{ inputs.os_id }}
          LABEL: ${{ inputs.label }}
          HOSTNAME_INPUT: ${{ inputs.hostname }}   # not HOSTNAME — bash sets that itself
          POSTGRES_VERSION: ${{ inputs.postgres_version }}
          PORT: ${{ inputs.port }}
          LISTEN_ADDRESS: ${{ inputs.listen_address }}
          PRIVATE_IP: ${{ inputs.private_ip }}
          DB_SUBNET: ${{ inputs.db_subnet }}
          BASTION_SUBNET: ${{ inputs.bastion_subnet }}
          APP_SUBNET: ${{ inputs.app_subnet }}
          FIREWALL_GROUP_ID: ${{ inputs.firewall_group_id }}
          ENVIRONMENT: ${{ inputs.environment }}
          DATABASES_JSON: ${{ steps.prepare-lists.outputs.databases_json }}
          DATABASE_USERS_JSON: ${{ steps.prepare-users.outputs.users_json }}
          VPC_IDS_JSON: ${{ steps.prepare-lists.outputs.vpc_ids_json }}
          SSH_KEY_IDS_JSON: ${{ steps.prepare-lists.outputs.ssh_key_ids_json }}
        run: |
          jq -n \
            --arg     vultr_api_key     "$VULTR_API_KEY" \
            --arg     region            "$REGION" \
            --arg     plan              "$PLAN" \
            --argjson os_id             "$OS_ID" \
            --arg     label             "$LABEL" \
            --arg     hostname          "$HOSTNAME_INPUT" \
            --arg     postgres_version  "$POSTGRES_VERSION" \
            --arg     postgres_password "$POSTGRES_PASSWORD" \
            --argjson port              "$PORT" \
            --arg     listen_address    "$LISTEN_ADDRESS" \
            --arg     private_ip        "$PRIVATE_IP" \
            --arg     db_subnet         "$DB_SUBNET" \
            --arg     bastion_subnet    "$BASTION_SUBNET" \
            --arg     app_subnet        "$APP_SUBNET" \
            --arg     firewall_group_id "$FIREWALL_GROUP_ID" \
            --arg     environment       "$ENVIRONMENT" \
            --argjson databases         "$DATABASES_JSON" \
            --argjson database_users    "$DATABASE_USERS_JSON" \
            --argjson vpc_ids           "$VPC_IDS_JSON" \
            --argjson ssh_key_ids       "$SSH_KEY_IDS_JSON" \
            '{
              vultr_api_key:     $vultr_api_key,
              region:            $region,
              plan:              $plan,
              os_id:             $os_id,
              label:             $label,
              hostname:          $hostname,
              postgres_version:  $postgres_version,
              postgres_password: $postgres_password,
              port:              $port,
              listen_address:    $listen_address,
              private_ip:        $private_ip,
              db_subnet:         $db_subnet,
              bastion_subnet:    $bastion_subnet,
              app_subnet:        $app_subnet,
              databases:         $databases,
              database_users:    $database_users,
              firewall_group_id: $firewall_group_id,
              vpc_ids:           $vpc_ids,
              ssh_key_ids:       $ssh_key_ids,
              tags:              [$environment]
            }' > terraform.tfvars.json

      - name: Debug - Show Generated Terraform Variables
        working-directory: ${{ inputs.terraform_dir }}
        # Diagnostics only — never fail the deploy from here. Secret values are
        # masked by the runner, so the raw dump is safe and is the only way to
        # see a malformed line when jq itself cannot parse the file.
        continue-on-error: true
        run: |
          echo "=== Generated terraform.tfvars.json (raw, numbered) ==="
          nl -ba terraform.tfvars.json
          echo "=== sha256 / size ==="
          sha256sum terraform.tfvars.json
          wc -c terraform.tfvars.json
          echo "=== Parsed ==="
          if jq 'del(.vultr_api_key, .postgres_password, .database_users)' terraform.tfvars.json; then
            echo "JSON is valid"
          else
            echo "WARNING: file is not valid JSON — see the numbered raw dump above"
          fi
          echo "========================================"

      - name: Terraform Init
        working-directory: ${{ inputs.terraform_dir }}
        env:
          ACCESS_KEY: ${{ secrets.VULTR_OBJECT_STORAGE_ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.VULTR_OBJECT_STORAGE_SECRET_KEY }}
        run: |
          terraform init \
            -backend-config="bucket=${{ inputs.state_bucket }}" \
            -backend-config="key=${{ inputs.state_key }}/terraform.tfstate" \
            -backend-config="access_key=$ACCESS_KEY" \
            -backend-config="secret_key=$SECRET_KEY"

      - name: Terraform Apply
        id: terraform-apply
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          terraform apply -auto-approve
          echo "instance_id=$(terraform output -raw id)" >> $GITHUB_OUTPUT
          echo "ip_address=$(terraform output -raw ip_address)" >> $GITHUB_OUTPUT
          echo "internal_ip=$(terraform output -raw internal_ip)" >> $GITHUB_OUTPUT
          echo "port=$(terraform output -raw port)" >> $GITHUB_OUTPUT

      - name: Wait for PostgreSQL to be Ready
        run: |
          IP_ADDRESS="${{ steps.terraform-apply.outputs.ip_address }}"
          PORT="${{ steps.terraform-apply.outputs.port }}"

          echo "Waiting for SSH on $IP_ADDRESS..."
          for i in {1..30}; do
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/$IP_ADDRESS/22" 2>/dev/null; then
              echo "SSH available — cloud-init is running"
              break
            fi
            echo "Waiting... (attempt $i/30)"
            sleep 10
          done

          echo "Waiting for PostgreSQL on port $PORT (cloud-init may take a few minutes)..."
          for i in {1..36}; do
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/$IP_ADDRESS/$PORT" 2>/dev/null; then
              echo "PostgreSQL is accepting connections!"
              break
            fi
            echo "Not ready yet (attempt $i/36)..."
            sleep 10
          done

      - name: Display Instance Info
        run: |
          echo "=== Vultr Self-Hosted PostgreSQL Provisioned ==="
          echo "Instance ID:   ${{ steps.terraform-apply.outputs.instance_id }}"
          echo "Public IP:     ${{ steps.terraform-apply.outputs.ip_address }}"
          echo "Internal IP:   ${{ steps.terraform-apply.outputs.internal_ip }}"
          echo "Port:          ${{ steps.terraform-apply.outputs.port }}"
          echo ""
          echo "Connect via VPC: postgresql://postgres@${{ steps.terraform-apply.outputs.internal_ip }}:${{ steps.terraform-apply.outputs.port }}"
          echo "================================================"
