name: Deploy Static Site to VPS (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (test, prod)'
        required: true
        type: string
      app_directory:
        description: 'Directory containing the application (relative to repo root)'
        required: false
        type: string
        default: '.'
      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      build_command:
        description: 'Build command'
        required: false
        type: string
        default: 'npm run build'
      dist_directory:
        description: 'Build output directory (relative to app_directory)'
        required: false
        type: string
        default: 'dist'
      server_ip:
        description: 'Server IP address (use private VPC IP when bastion_ip is set)'
        required: true
        type: string
      bastion_ip:
        description: 'Bastion/jump host public IP for SSH ProxyJump (leave empty for direct SSH)'
        required: false
        type: string
        default: ''
      # Give either base_domain (and let the convention apply) or nginx_domain
      # (and say it outright). nginx_domain stays supported and stays the
      # winner when both are set, so every caller written before base_domain
      # existed keeps working untouched.
      base_domain:
        description: 'Apex domain, e.g. example.com. Deploys to the apex on prod and to {environment}.apex everywhere else. Ignored when nginx_domain is set.'
        required: false
        type: string
        default: ''
      nginx_domain:
        description: 'Explicit domain for nginx server_name and certbot, bypassing the base_domain convention. One of the two is required.'
        required: false
        type: string
        default: ''
      certbot_email:
        description: 'Email for certbot SSL certificate. Leave empty to skip SSL.'
        required: false
        type: string
        default: ''
      build_env_vars:
        description: 'Newline-separated KEY=VALUE pairs to set as env vars before building'
        required: false
        type: string
        default: ''
      # Security headers are opt-in so that adding them here changes nothing for
      # sites already deployed through this workflow. A caller turns them on
      # once it knows its own content requirements; a CSP guessed on a site's
      # behalf breaks it in production.
      security_headers:
        description: 'Emit HSTS, X-Content-Type-Options, X-Frame-Options, Referrer-Policy and Permissions-Policy'
        required: false
        type: boolean
        default: false
      # The policy itself is built here rather than pasted into every caller.
      # Only the origins a given product talks to differ between sites, so those
      # are the only things a caller passes; everything else in a CSP for a
      # self-contained SPA is the same boilerplate each time, and boilerplate
      # copied into six repos is boilerplate that drifts in six directions.
      api_base_url:
        description: 'Origin of the API this site calls, e.g. https://api.example.com. Added to connect-src along with its wss:// form, so a site using websockets does not have to spell that out.'
        required: false
        type: string
        default: ''
      csp_connect_src:
        description: "Extra origins for connect-src beyond api_base_url — object storage, a CDN. Space-separated. 'self' is always included."
        required: false
        type: string
        default: ''
      csp_img_src:
        description: "Extra origins for img-src, space-separated — a CDN or object storage. 'self' data: blob: are always included."
        required: false
        type: string
        default: ''
      content_security_policy:
        description: 'Full CSP, replacing the built-in baseline entirely. Only for a site the baseline cannot express; prefer csp_connect_src / csp_img_src.'
        required: false
        type: string
        default: ''
      csp_report_only:
        description: 'Send the CSP as Content-Security-Policy-Report-Only (observe without enforcing)'
        required: false
        type: boolean
        default: false

    secrets:
      SSH_PRIVATE_KEY:
        description: 'SSH private key for server access'
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      # Resolved once and published as DEPLOY_DOMAIN, because four later steps
      # need the same answer — rsync target, nginx server_name, certbot, and
      # the run summary. Deriving it in each of them is how a deploy ends up
      # writing files to one hostname and issuing a certificate for another.
      - name: Resolve deployment domain
        env:
          BASE_DOMAIN: ${{ inputs.base_domain }}
          NGINX_DOMAIN: ${{ inputs.nginx_domain }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ -n "${NGINX_DOMAIN}" ]; then
            RESOLVED="${NGINX_DOMAIN}"
          elif [ -n "${BASE_DOMAIN}" ]; then
            # The house convention: prod owns the apex, every other environment
            # is a subdomain named after itself.
            if [ "${ENVIRONMENT}" = "prod" ]; then
              RESOLVED="${BASE_DOMAIN}"
            else
              RESOLVED="${ENVIRONMENT}.${BASE_DOMAIN}"
            fi
          else
            echo "Provide either base_domain or nginx_domain — there is no domain to deploy to." >&2
            exit 1
          fi

          echo "DEPLOY_DOMAIN=${RESOLVED}" >> "$GITHUB_ENV"
          echo "Deploying to ${RESOLVED}"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.app_directory }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ inputs.app_directory }}
        run: npm ci

      - name: Build Application
        working-directory: ${{ inputs.app_directory }}
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] && export "$line"
          done <<< '${{ inputs.build_env_vars }}'
          ${{ inputs.build_command }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -l -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "ERROR: deploy_key is invalid — check SSH_PRIVATE_KEY secret"
            exit 1
          fi

          BASTION="${{ inputs.bastion_ip }}"
          if [ -n "$BASTION" ]; then
            cat > ~/.ssh/config << EOF
          Host ${{ inputs.server_ip }}
              ProxyJump root@${BASTION}
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null

          Host ${BASTION}
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
          EOF
            chmod 600 ~/.ssh/config
          else
            ssh-keyscan -H ${{ inputs.server_ip }} >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

      - name: Prepare Server
        run: |
          SERVER_IP="${{ inputs.server_ip }}"
          DOMAIN="${DEPLOY_DOMAIN}"

          ssh -i ~/.ssh/deploy_key root@${SERVER_IP} << ENDSSH
          set -e
          # Wait for cloud-init and unattended upgrades to finish
          while sudo fuser /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock* 2>/dev/null; do
            sleep 5
          done
          if ! command -v nginx &> /dev/null; then
            apt-get update -qq
            apt-get install -y nginx
            systemctl enable nginx
            systemctl start nginx
          fi
          mkdir -p /var/www/${DOMAIN}
          ENDSSH

      - name: Deploy Static Files
        run: |
          SERVER_IP="${{ inputs.server_ip }}"
          DOMAIN="${DEPLOY_DOMAIN}"
          DIST="${{ inputs.app_directory }}/${{ inputs.dist_directory }}"

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ${DIST}/ root@${SERVER_IP}:/var/www/${DOMAIN}/

      - name: Configure Nginx and SSL
        env:
          SECURITY_HEADERS: ${{ inputs.security_headers }}
          CSP: ${{ inputs.content_security_policy }}
          API_BASE_URL: ${{ inputs.api_base_url }}
          CSP_CONNECT_SRC: ${{ inputs.csp_connect_src }}
          CSP_IMG_SRC: ${{ inputs.csp_img_src }}
          CSP_REPORT_ONLY: ${{ inputs.csp_report_only }}
        run: |
          SERVER_IP="${{ inputs.server_ip }}"
          DOMAIN="${DEPLOY_DOMAIN}"
          EMAIL="${{ inputs.certbot_email }}"

          # Built here rather than inline in the server block so the config
          # template stays one shape whether or not a caller opted in: the
          # snippet is always written and always included, and is simply empty
          # when security_headers is false.
          SECURITY_SNIPPET=""
          if [ "${SECURITY_HEADERS}" = "true" ]; then
            SECURITY_SNIPPET='add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Frame-Options "DENY" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;'

            # The baseline suits a self-contained SPA: its own bundle, its own
            # styles, and whatever origins the caller named. The two loose
            # directives are deliberate and worth knowing about —
            #   style-src needs 'unsafe-inline' because component libraries and
            #     ad-hoc style={{…}} props set inline styles; tightening it is a
            #     refactor of the app, not a change here, and script-src is the
            #     half that actually stops XSS.
            #   img-src allows data: and blob: for inline icons and for previews
            #     of a file the user just picked, before it has been uploaded.
            # An API origin implies two CSP sources, not one: the https origin
            # for ordinary requests and its wss form for websockets. Deriving
            # the second here means a caller states its API host once, in the
            # shape it already uses everywhere else, instead of hand-writing a
            # parallel wss:// spelling that can silently fall out of step with
            # it after a rename.
            API_ORIGINS=""
            if [ -n "${API_BASE_URL}" ]; then
              # A CSP source is scheme + host + optional port; a trailing slash
              # or a path makes the whole directive invalid, and the browser
              # drops it silently.
              API_ORIGIN="${API_BASE_URL%/}"
              case "${API_ORIGIN}" in
                https://*) API_ORIGINS="${API_ORIGIN} wss://${API_ORIGIN#https://}" ;;
                http://*)  API_ORIGINS="${API_ORIGIN} ws://${API_ORIGIN#http://}" ;;
                *)
                  echo "api_base_url must include a scheme, e.g. https://api.example.com (got: ${API_BASE_URL})" >&2
                  exit 1
                  ;;
              esac
            fi

            CSP_VALUE="${CSP}"
            if [ -z "${CSP_VALUE}" ]; then
              CSP_VALUE="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:${CSP_IMG_SRC:+ ${CSP_IMG_SRC}}; connect-src 'self'${API_ORIGINS:+ ${API_ORIGINS}}${CSP_CONNECT_SRC:+ ${CSP_CONNECT_SRC}}; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
            fi

            CSP_HEADER="Content-Security-Policy"
            if [ "${CSP_REPORT_ONLY}" = "true" ]; then
              CSP_HEADER="Content-Security-Policy-Report-Only"
            fi
            SECURITY_SNIPPET="${SECURITY_SNIPPET}
          add_header ${CSP_HEADER} \"${CSP_VALUE}\" always;"
          fi

          ssh -i ~/.ssh/deploy_key root@${SERVER_IP} << ENDSSH
          set -e

          mkdir -p /etc/nginx/snippets
          cat > /etc/nginx/snippets/${DOMAIN}-security.conf << 'SECEOF'
          ${SECURITY_SNIPPET}
          SECEOF

          cat > /etc/nginx/sites-available/${DOMAIN} << 'NGINXEOF'
          server {
              listen 80;
              server_name ${DOMAIN};
              root /var/www/${DOMAIN};
              index index.html;

              include /etc/nginx/snippets/${DOMAIN}-security.conf;

              # The include is repeated in every location, and that repetition
              # is load-bearing. nginx inherits add_header from an outer level
              # ONLY when the current level declares no add_header of its own —
              # so the Cache-Control lines below would silently discard every
              # server-level security header for these locations, which between
              # them serve the entire site.
              location ~* \.(js|css|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf|ico)\$ {
                  try_files \$uri =404;
                  add_header Cache-Control "public, max-age=31536000, immutable";
                  include /etc/nginx/snippets/${DOMAIN}-security.conf;
              }

              location / {
                  try_files \$uri \$uri/ /index.html;
                  add_header Cache-Control "no-cache";
                  include /etc/nginx/snippets/${DOMAIN}-security.conf;
              }
          }
          NGINXEOF

          ln -sf /etc/nginx/sites-available/${DOMAIN} /etc/nginx/sites-enabled/${DOMAIN}
          rm -f /etc/nginx/sites-enabled/default
          nginx -t
          systemctl reload nginx

          if [ -n "${EMAIL}" ]; then
            if ! command -v certbot &> /dev/null; then
              apt-get install -y certbot python3-certbot-nginx
            fi
            certbot --nginx -d ${DOMAIN} --email ${EMAIL} --agree-tos --non-interactive --redirect
            systemctl reload nginx
          fi
          ENDSSH

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment Summary
        run: |
          echo "## Static Site Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Domain:** https://${DEPLOY_DOMAIN}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** ${{ inputs.server_ip }}" >> $GITHUB_STEP_SUMMARY
