name: Deploy Linode Firewall (Reusable)

on:
  workflow_call:
    inputs:
      firewall_label:
        description: 'Label for the firewall (e.g., "web-server-firewall")'
        required: true
        type: string
      firewall_type:
        description: 'Type of firewall: "web" (80,443,22), "database" (5432,22), "custom"'
        required: false
        type: string
        default: 'web'
      allow_ssh_from:
        description: 'CIDR ranges allowed to SSH (e.g., "1.2.3.4/32,5.6.7.8/32"). Leave empty for 0.0.0.0/0'
        required: false
        type: string
        default: ''
      environment:
        description: 'Deployment environment for tagging (e.g., test, prod)'
        required: false
        type: string
        default: 'production'
      terraform_dir:
        description: 'Directory containing Terraform configuration for firewall'
        required: false
        type: string
        default: 'modules/terraform/linode/firewall'
    secrets:
      LINODE_TOKEN:
        description: 'Linode API Token'
        required: false
    outputs:
      firewall_id:
        description: 'The ID of the created firewall'
        value: ${{ jobs.deploy-firewall.outputs.firewall_id }}

jobs:
  deploy-firewall:
    runs-on: ubuntu-latest
    if: ${{ inputs.environment != 'prod' || github.ref == 'refs/heads/main' }}
    environment: ${{ inputs.environment }}
    outputs:
      firewall_id: ${{ steps.terraform-apply.outputs.firewall_id }}
    steps:
      - name: Checkout Terraform Modules
        uses: actions/checkout@v4
        with:
          repository: nexsware/modules
          path: modules

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: '1.6.0'
          terraform_wrapper: false

      - name: Determine SSH Source IPs
        id: get-ssh-source
        run: |
          if [ -z "${{ inputs.allow_ssh_from }}" ]; then
            echo "No SSH restrictions specified, allowing from anywhere"
            echo "ssh_source=0.0.0.0/0" >> $GITHUB_OUTPUT
          else
            echo "Using provided CIDR ranges: ${{ inputs.allow_ssh_from }}"
            # Normalize IPs to include CIDR notation if missing
            NORMALIZED=""
            IFS=',' read -ra IPS <<< "${{ inputs.allow_ssh_from }}"
            for ip in "${IPS[@]}"; do
              # Trim whitespace
              ip=$(echo "$ip" | xargs)
              # Check if IP already has CIDR notation (contains /)
              if [[ ! "$ip" =~ / ]]; then
                # Add /32 for single IP
                ip="${ip}/32"
              fi
              if [ -z "$NORMALIZED" ]; then
                NORMALIZED="$ip"
              else
                NORMALIZED="$NORMALIZED,$ip"
              fi
            done
            echo "Normalized CIDR: $NORMALIZED"
            echo "ssh_source=$NORMALIZED" >> $GITHUB_OUTPUT
          fi

      - name: Create Terraform Variables File
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          # Convert comma-separated CIDR ranges to JSON array
          IFS=',' read -ra CIDRS <<< "${{ steps.get-ssh-source.outputs.ssh_source }}"
          CIDRS_JSON="["
          for i in "${!CIDRS[@]}"; do
            CIDRS_JSON+="\"${CIDRS[$i]}\""
            if [ $i -lt $(( ${#CIDRS[@]} - 1 )) ]; then
              CIDRS_JSON+=","
            fi
          done
          CIDRS_JSON+="]"

          # IPv6 values
          IPV6_ALL='["::/0"]'

          # Determine inbound rules based on firewall type
          FIREWALL_TYPE="${{ inputs.firewall_type }}"

          cat > terraform.tfvars <<EOF
          linode_token = "${{ secrets.LINODE_TOKEN }}"
          firewall_label = "${{ inputs.firewall_label }}"
          firewall_tags = ["${{ inputs.environment }}"]
          linodes = []
          inbound_rules = [
            {
              label    = "allow-ssh"
              action   = "ACCEPT"
              protocol = "TCP"
              ports    = "22"
              ipv4     = ${CIDRS_JSON}
              ipv6     = ${IPV6_ALL}
            },
            {
              label    = "allow-http"
              action   = "ACCEPT"
              protocol = "TCP"
              ports    = "80"
              ipv4     = ["0.0.0.0/0"]
              ipv6     = ${IPV6_ALL}
            },
            {
              label    = "allow-https"
              action   = "ACCEPT"
              protocol = "TCP"
              ports    = "443"
              ipv4     = ["0.0.0.0/0"]
              ipv6     = ${IPV6_ALL}
            }
          ]
          outbound_rules = [
            {
              label    = "allow-dns"
              action   = "ACCEPT"
              protocol = "UDP"
              ports    = "53"
              ipv4     = ["0.0.0.0/0"]
              ipv6     = ["::/0"]
            },
            {
              label    = "allow-dns-tcp"
              action   = "ACCEPT"
              protocol = "TCP"
              ports    = "53"
              ipv4     = ["0.0.0.0/0"]
              ipv6     = ["::/0"]
            },
            {
              label    = "allow-http-out"
              action   = "ACCEPT"
              protocol = "TCP"
              ports    = "80"
              ipv4     = ["0.0.0.0/0"]
              ipv6     = ["::/0"]
            },
            {
              label    = "allow-https-out"
              action   = "ACCEPT"
              protocol = "TCP"
              ports    = "443"
              ipv4     = ["0.0.0.0/0"]
              ipv6     = ["::/0"]
            },
            {
              label    = "allow-ntp"
              action   = "ACCEPT"
              protocol = "UDP"
              ports    = "123"
              ipv4     = ["0.0.0.0/0"]
              ipv6     = ["::/0"]
            }
          ]
          EOF

      - name: Debug - Show Generated Terraform Variables
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          echo "=== Generated terraform.tfvars ==="
          cat terraform.tfvars
          echo "==================================="

      - name: Initialize Terraform
        working-directory: ${{ inputs.terraform_dir }}
        run: terraform init

      - name: Apply Terraform Configuration
        id: terraform-apply
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          terraform apply -auto-approve
          echo "firewall_id=$(terraform output -raw firewall_id)" >> $GITHUB_OUTPUT